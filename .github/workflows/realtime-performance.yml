name: Realtime Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: realtime-performance-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.13.1
  NPM_VERSION: 11.8.0

jobs:
  realtime-performance:
    name: realtime-performance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Fixar npm aprovado
        run: npm install --global npm@${NPM_VERSION}

      - name: Instalação reproduzível
        run: npm ci

      - name: Instalar Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Benchmark Realtime local
        run: npm run test:e2e:performance

      - name: Sanitizar relatório
        if: always()
        run: npm run test:e2e:sanitize
      - name: Limpar Supabase local
        if: always()
        run: npm run test:db:stop

      - name: Publicar relatório e métricas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realtime-performance
          path: |
            playwright-report/
            specs/003-close-session/validation/realtime-p95/automated-local.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
